plugins {
    id 'com.android.application'
}
android {
    namespace 'com.soyeib.studydesk'
    compileSdk 34
    defaultConfig {
        applicationId "com.soyeib.studydesk"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.4"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
